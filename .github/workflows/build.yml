name: Build and Release CarLife AutoStarter APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Prepare Release APK
      run: |
        mkdir -p release-apks
        cp app/build/outputs/apk/release/app-release.apk release-apks/CarLifeAutoStarter-Release.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarLifeAutoStarter-Release-APK
        path: release-apks/CarLifeAutoStarter-Release.apk

    - name: Publish APK to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-apks/CarLifeAutoStarter-Release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
